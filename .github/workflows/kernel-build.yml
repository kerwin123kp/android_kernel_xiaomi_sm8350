name: Auto Patch & Build Kali NetHunter Kernel

on:
  push:
    branches:
      - main  # Change this if your default branch is different
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: kerwin123kp/android_kernel_xiaomi_sdm845
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y wget curl git unzip bc build-essential flex bison \
            libssl-dev ccache make python3

    - name: Clone NetHunter Patches
      run: |
        git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nethunter_patches
        cd nethunter_patches
        ./apply-patches.sh ../
        cd ..

    - name: Download & Setup Clang 18
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        echo "PATH=/usr/lib/llvm-18/bin:$PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Configure Kernel
      run: |
        make perseus_defconfig

    - name: Compile Kernel
      run: |
        make -j$(nproc) CC=clang

    - name: Package Flashable ZIP
      run: |
        mkdir -p nethunter_kernel_zip
        cp arch/arm64/boot/Image.gz-dtb nethunter_kernel_zip/
        wget https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/master/update-binary -O nethunter_kernel_zip/update-binary
        wget https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel/-/raw/master/updater-script -O nethunter_kernel_zip/updater-script
        cd nethunter_kernel_zip
        zip -r ../nethunter_kernel.zip *
        cd ..

    - name: Upload Kernel & ZIP
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel
        path: nethunter_kernel.zip
