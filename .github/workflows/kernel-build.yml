name: Auto Kernel Patcher for Xiaomi 11T

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: kerwin123kp/android_kernel_xiaomi_sm8350
          ref: lineage-22.1  # Set to your kernel branch

      - name: 🛠 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl bc bison flex \
                              build-essential zip unzip \
                              python3 python3-pip \
                              ccache libssl-dev \
                              libelf-dev libncurses-dev \
                              device-tree-compiler

      - name: ⚡ Install Clang 19 (Fixed)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          export PATH=/usr/bin:$PATH
          clang --version

      - name: 🔄 Apply Kali NetHunter Patches
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nethunter
          cd nethunter
          bash patch-kernel.sh ../

      - name: 🔧 Configure Kernel
        run: |
          cd android_kernel_xiaomi_sm8350
          make O=out ARCH=arm64 lineage_defconfig
          cat out/.config | grep CONFIG_  # Show applied config

      - name: 🚀 Compile Kernel
        run: |
          cd android_kernel_xiaomi_sm8350
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="kerwin123kp"
          export KBUILD_BUILD_HOST="GitHubActions"
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: 📦 Create AnyKernel3 Flashable ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 AnyKernel3.zip ./

      - name: 📤 Upload Kernel ZIP
        uses: actions/upload-artifact@v3
        with:
          name: Xiaomi-11T-Kernel
          path: AnyKernel/AnyKernel3.zip
