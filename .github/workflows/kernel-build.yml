name: Auto Kernel Patcher

on:
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source (lineage-22.1)
        uses: actions/checkout@v4
        with:
          repository: kerwin123kp/android_kernel_xiaomi_sm8350
          ref: lineage-22.1  # Ensure it pulls the correct branch
          path: kernel

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex build-essential clang \
          git python3 libssl-dev wget ccache lld lldb \
          unzip libncurses-dev

      - name: Download & Setup Clang Toolchain (Clang 19)
        run: |
          mkdir -p toolchains
          cd toolchains
          wget -O clang.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-19.0.4/clang+llvm-19.0.4-x86_64-linux-gnu.tar.xz
          tar -xf clang.tar.xz
          export PATH=$PWD/clang+llvm-19.0.4-x86_64-linux-gnu/bin:$PATH
          cd ..

      - name: Apply NetHunter Patches
        run: |
          cd kernel
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git
          cp kali-nethunter-kernel-builder/patches/* patches/
          git apply patches/*.patch || echo "Patching failed, check logs"

      - name: Configure Kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          make O=out ARCH=arm64 perseus_defconfig  # Change if needed

      - name: Compile Kernel
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Package Kernel
        run: |
          cd kernel
          mkdir -p anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          zip -r9 Kernel-Nethunter.zip anykernel

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Nethunter
          path: kernel/Kernel-Nethunter.zip
