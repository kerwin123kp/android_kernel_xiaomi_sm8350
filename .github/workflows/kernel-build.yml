name: Auto Kernel Patcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: kerwin123kp/android_kernel_xiaomi_sm8350
          ref: lineage-22.1
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y wget curl git clang lld llvm build-essential bc flex bison \
            libssl-dev ccache make automake autoconf libtool python3-pip \
            libncurses-dev git-lfs libelf-dev

      - name: Clone NetHunter Kernel Builder
        run: git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nethunter

      - name: Apply NetHunter Patches
        run: |
          cd nethunter
          chmod +x build.sh
          ./build.sh -p  # Automatically patch the kernel

      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchains
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-19.0.4/clang+llvm-19.0.4-x86_64-linux-gnu.tar.xz
          tar -xf clang+llvm-19.0.4-x86_64-linux-gnu.tar.xz -C toolchains
          export PATH=$PWD/toolchains/clang+llvm-19.0.4-x86_64-linux-gnu/bin:$PATH

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PWD/toolchains/clang+llvm-19.0.4-x86_64-linux-gnu/bin:$PATH
          make O=out vili_defconfig
          make O=out -j$(nproc) CC=clang CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 Kernel-Nethunter.zip *

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: Kernel-Nethunter
          path: anykernel/Kernel-Nethunter.zip
