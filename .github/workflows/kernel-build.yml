name: Auto Kernel Patcher

on:
  push:
    branches:
      - lineage-22.1
  pull_request:
    branches:
      - lineage-22.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl clang lld llvm bc bison flex build-essential libssl-dev \
          ccache make python3 rsync unzip xz-utils libarchive-tools
      
      - name: Clone NetHunter Kernel Builder
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nethunter

      - name: Apply NetHunter Patches
        run: |
          cd nethunter
          chmod +x build.sh
          export TERM=xterm  # Prevents TERM errors
          ./build.sh -p --no-interaction --defconfig vili_defconfig || echo "[ERROR] Patch script failed"

      - name: Configure Kernel
        run: |
          cd nethunter
          ./build.sh -c --defconfig vili_defconfig

      - name: Compile Kernel
        run: |
          cd nethunter
          ./build.sh -b --no-interaction

      - name: Package Kernel (AnyKernel3)
        run: |
          cd nethunter
          ./build.sh -z
      
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v3
        with:
          name: NetHunter-Kernel
          path: nethunter/out/*.zip
