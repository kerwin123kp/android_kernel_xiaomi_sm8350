name: Auto Kernel Patcher for Xiaomi 11T Pro

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: kerwin123kp/android_kernel_xiaomi_sm8350
          ref: lineage-22.1  # Set to your kernel branch

      - name: 🛠 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl bc bison flex \
                              build-essential zip unzip \
                              python3 python3-pip \
                              ccache libssl-dev \
                              libelf-dev libncurses-dev \
                              device-tree-compiler

      - name: ⚡ Install Clang 19 (Fixed)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          export PATH=/usr/bin:$PATH
          clang --version

      - name: 🔄 Clone NetHunter Kernel Builder
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nethunter
          if [ ! -f "nethunter/build.sh" ]; then
            echo "❌ Error: build.sh not found!"
            exit 1
          fi

      - name: 🔧 Run NetHunter Build Script
        run: |
          cd nethunter
          chmod +x build.sh
          ./build.sh -t ../android_kernel_xiaomi_sm8350 -c lineage_defconfig -b

      - name: 📦 Create AnyKernel3 Flashable ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp android_kernel_xiaomi_sm8350/out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 AnyKernel3.zip ./

      - name: 📤 Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Kernel
          path: AnyKernel/AnyKernel3.zip
